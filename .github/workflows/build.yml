name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          echo "$PWD/gradle-8.1/bin" >> $GITHUB_PATH
      - name: Build APK
        run: gradle assembleDebug --stacktrace 2>&1 | grep -A5 "FAILURE\|error:\|Error\|Exception" | head -50
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gesture-apk
          path: app/build/outputs/apk/debug/app-debug.apk
