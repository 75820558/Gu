name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          echo "$PWD/gradle-8.1/bin" >> $GITHUB_PATH
      - name: Build APK
        run: gradle assembleDebug
      - name: Sign APK
        run: |
          keytool -genkey -v -keystore my.keystore \
            -alias key -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass 123456 -keypass 123456 \
            -dname "CN=GestureAI,O=GestureAI,C=UA"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -1)/apksigner \
            sign --ks my.keystore \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --out gesture.apk \
            app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gesture-apk
          path: gesture.apk
          compression-level: 0
